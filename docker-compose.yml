name: smaki

services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command: ['--data-dir', '/data', '--api-key', '${TYPESENSE_API_KEY:-dev-typesense-key}', '--enable-cors']
    # allow containers to reach services running on your host, if needed
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - typesense-data:/data
    ports:
      - '8108:8108'
    networks:
      default:
        aliases: ['smaki-typesense']

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - ./data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NUXT_TYPESENSE_URL: http://smaki-typesense:8108
      NUXT_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dev-typesense-key}
      NUXT_LLM_URL: ${NUXT_LLM_URL:-}
      NUXT_LLM_MODEL: ${NUXT_LLM_MODEL:-}
      NUXT_LLM_API_KEY: ${NUXT_LLM_API_KEY:-}
      NUXT_EMBEDDING_MODEL: ${NUXT_EMBEDDING_MODEL:-ts/e5-small}
      NUXT_EMBEDDING_URL: ${NUXT_EMBEDDING_URL:-}
      NUXT_EMBEDDING_API_KEY: ${NUXT_EMBEDDING_API_KEY:-}
    command: sh -c "npm install && npm run db:migrate && npm run dev -- --host 0.0.0.0"
    ports:
      - '3000'
    depends_on:
      - typesense
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=pontsun'
      - 'traefik.http.routers.smaki.service=smaki'
      - 'traefik.http.routers.smaki.entrypoints=https,http'
      - 'traefik.http.routers.smaki.rule=Host(`smaki.docker.test`)'
      - 'traefik.http.services.smaki.loadbalancer.server.port=3000'
      - 'traefik.http.routers.smaki.middlewares=https_redirect'
      - 'traefik.http.middlewares.https_redirect.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.https_redirect.redirectscheme.permanent=true'
    networks: [pontsun, default]

volumes:
  typesense-data:
  app-node-modules:

networks:
  pontsun:
    external: true
